[tools]
node = '20'
java = 'openjdk-21'

[env]
APP_BUILD_NUMBER = '6'

[tasks.check]
description = 'Run svelte-check to verify code'
run = 'npm run check'

[tasks.test]
description = 'Run tests with vitest'
run = 'npm test'

[tasks."e2e:test"]
description = 'Run Playwright E2E tests'
run = 'npm run test:e2e'

[tasks."e2e:record"]
description = 'Run E2E test and record screen to MP4/WebM'
run = 'npm run record:e2e'

[tasks."e2e:ui"]
description = 'Run Playwright in interactive UI mode'
run = 'npm run test:e2e:ui'

[tasks.dev]
description = 'Start development server'
run = 'npm run dev'

[tasks."set-version"]
description = 'Set version from git tag and build number from env'
run = "npx capacitor-set-version -v $(git describe --tags --abbrev=0 | sed 's/^v//') -b $APP_BUILD_NUMBER"

[tasks."debug:ios"]
description = 'Run and debug on iOS simulator'
depends = ["sync:ios"]
run = 'npx cap run ios'
raw = true

[tasks."debug:android"]
description = 'Run and debug on Android emulator'
depends = ["sync:android"]
run = 'npx cap run android'
raw = true

[tasks.clean]
description = 'Clean up build artifacts (Xcode DerivedData, etc.)'
run = 'rm -rf ios/DerivedData'

[tasks.build]
description = 'Build web assets for production'
run = 'npm run build'

[tasks."sync:android"]
description = 'Sync web assets to Android platform'
depends = ["build", "set-version"]
run = 'npx cap sync android'

[tasks."sync:ios"]
description = 'Sync web assets to iOS platform'
depends = ["build", "set-version"]
run = [
    'npx cap sync ios',
    'node scripts/patch-native-run.mjs'
]

[tasks."release:android"]
description = 'Build Android release APK'
depends = ["sync:android"]
run = [
    'cd android && ./gradlew assembleRelease'
]

[tasks."release:ios"]
description = 'Build iOS release'
depends = ["sync:ios"]
run = 'npx cap build ios --flavor Release'

[tasks.release]
description = 'Perform all release steps (Android & iOS)'
depends = ["check", "release:android", "release:ios"]
