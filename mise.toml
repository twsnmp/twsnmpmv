[tools]
node = '20'
java = 'openjdk-21'

[tasks.check]
description = 'Run svelte-check to verify code'
run = 'npm run check'

[tasks.test]
description = 'Run tests with vitest'
run = 'npm test'

[tasks.dev]
description = 'Start development server'
run = 'npm run dev'

[tasks."debug:ios"]
description = 'Run and debug on iOS simulator'
depends = ["sync:ios"]
run = 'npx cap run ios'

[tasks."debug:android"]
description = 'Run and debug on Android emulator'
depends = ["sync:android"]
run = 'npx cap run android'

[tasks.clean]
description = 'Clean up build artifacts (Xcode DerivedData, etc.)'
run = 'rm -rf ios/DerivedData'

[tasks.build]
description = 'Build web assets for production'
run = 'npm run build'

[tasks."sync:android"]
description = 'Sync web assets to Android platform'
depends = ["build"]
run = 'npx cap sync android'

[tasks."sync:ios"]
description = 'Sync web assets to iOS platform'
depends = ["build"]
run = 'npx cap sync ios'

[tasks."release:android"]
description = 'Build Android release APK'
depends = ["sync:android"]
run = [
    'cd android && ./gradlew assembleRelease'
]

[tasks."release:ios"]
description = 'Build iOS release'
depends = ["sync:ios"]
run = 'npx cap build ios --flavor Release'

[tasks.release]
description = 'Perform all release steps (Android & iOS)'
depends = ["check", "release:android", "release:ios"]
