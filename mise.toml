[tools]
node = '20'
java = 'openjdk-21'

[tasks.check]
description = 'Run svelte-check to verify code'
run = 'npm run check'

[tasks.build]
description = 'Build web assets for production'
run = 'npm run build'

[tasks."sync:android"]
description = 'Sync web assets to Android platform'
depends = ["build"]
run = 'npx cap sync android'

[tasks."sync:ios"]
description = 'Sync web assets to iOS platform'
depends = ["build"]
run = 'npx cap sync ios'

[tasks."release:android"]
description = 'Build Android release APK'
depends = ["sync:android"]
run = [
    'cd android && ./gradlew assembleRelease'
]

[tasks."release:ios"]
description = 'Build iOS release'
depends = ["sync:ios"]
run = 'npx cap build ios --flavor Release'

[tasks.release]
description = 'Perform all release steps (Android & iOS)'
depends = ["check", "release:android", "release:ios"]
